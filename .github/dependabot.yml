version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: [react, react-dom, react-server-dom-webpack, '@types/react*']
      cloudflare:
        patterns: [wrangler, '@cloudflare/*', vinext, vite, '@vitejs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
