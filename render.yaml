services:
  - type: web
    name: rockshowbot
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:
      name: rockshowbot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_CONTACT
        sync: false
      - key: APPLE_MUSIC_DEVELOPER_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: DATABASE_PATH
        value: /var/data/rockshowbot.db
      - key: PORT
        value: "10000"
      - key: SCAN_INTERVAL_HOURS
        value: "12"
      - key: EVENT_RETENTION_DAYS
        value: "30"
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: PREDICTHQ_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
